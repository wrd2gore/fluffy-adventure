# إعداد النشر على Cloudflare. لا تضع هنا أي أسرار: الأسرار تُضاف بأمر wrangler secret put (انظر المجلد guide).
name = "school-attendance"
main = "worker.js"
compatibility_date = "2025-09-01"

# الموقع (مجلد site) يُقدَّم عبر الـ Worker نفسه حتى تُضاف ترويسات الأمان إلى كل صفحة.
[assets]
directory = "../site"
binding = "ASSETS"
run_worker_first = true

# قاعدة البيانات: لا عنوان عام لها. الوصول الوحيد من خلال هذا الربط داخل الـ Worker.
[[d1_databases]]
binding = "DB"
database_name = "school-db"
database_id = "ضع-هنا-المعرّف-الذي-يظهر-بعد-إنشاء-القاعدة"

# معلومات غير سرّية فقط (مفتاح Turnstile العام اختياري).
[vars]
TURNSTILE_SITE_KEY = ""

# الأسرار التي تُضاف يدوياً ولا تُكتب في أي ملف:
#   FIREBASE_API_KEY, FIREBASE_SERVICE_ACCOUNT, ADMIN_UIDS, TURNSTILE_SECRET (اختياري)
